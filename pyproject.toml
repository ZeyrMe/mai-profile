[project]
name = "mai-profile"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.23,<2.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.5.0", "ruff>=0.8", "pip-audit>=2.7,<3", "packaging>=24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
